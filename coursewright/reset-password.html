<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Coursewright</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-side">
    <a href="index.html" class="brand"><span class="brand-mark"></span>Coursewright</a>
    <p class="quote">Choose something new, then pick up your track right where you left it.</p>
  </div>
  <div class="auth-form-wrap">
    <div class="auth-card">
      <div class="eyebrow">Link verified</div>
      <h2>Set a new password</h2>
      <form action="login.html" method="get">
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" name="password" placeholder="At least 8 characters" required>
        </div>
        <div class="field">
          <label for="confirm">Confirm new password</label>
          <input type="password" id="confirm" name="confirm" placeholder="Repeat password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block mt-8">Update password</button>
      </form>
      <p class="auth-foot"><a href="login.html">← Back to log in</a></p>
    </div>
  </div>
</div>
</body>
</html>
