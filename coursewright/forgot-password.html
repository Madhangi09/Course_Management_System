<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password — Coursewright</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-side">
    <a href="index.html" class="brand"><span class="brand-mark"></span>Coursewright</a>
    <p class="quote">Losing access shouldn't cost you your place in a course. We'll get you back in.</p>
  </div>
  <div class="auth-form-wrap">
    <div class="auth-card">
      <div class="eyebrow">Account recovery</div>
      <h2>Reset your password</h2>
      <p class="muted">Enter the email on your account and we'll send a secure link to choose a new password.</p>
      <form action="reset-password.html" method="get">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block mt-8">Send reset link</button>
      </form>
      <p class="auth-foot"><a href="login.html">← Back to log in</a></p>
    </div>
  </div>
</div>
</body>
</html>
