
services:
  - type: web
    name: course-management-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node FSD_14.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
